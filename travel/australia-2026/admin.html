<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#111111" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦘</text></svg>" />
<title>管理者設定｜澳洲旅遊手冊</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="app-header" id="app-header"></header>
<main>
  <h2 class="section-title" style="margin-top:0">管理者登入</h2>
  <div id="admin-auth-area"></div>

  <div id="admin-panel" style="display:none">
    <h2 class="section-title">建立新的旅遊代碼</h2>
    <div class="converter-card">
      <label class="converter-field">
        <span>旅遊代碼</span>
        <input type="text" id="new-trip-code" placeholder="例如：yan-family-au2026" />
      </label>
      <button type="button" class="add-expense-btn" id="create-trip-btn">建立</button>
    </div>
    <div class="rate-info" id="create-trip-result"></div>
    <p class="hint">建立好之後，把這組代碼私訊分享給旅伴，請他們到匯率頁或行前清單頁輸入同一組代碼連線</p>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/12.5.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.5.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore-compat.js"></script>
<script src="js/data.js"></script>
<script src="js/cloudsync.js"></script>
<script src="js/app.js"></script>
<script>renderAdminPage();</script>
</body>
</html>
