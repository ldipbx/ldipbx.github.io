<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#111111" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦘</text></svg>" />
<title>匯率換算｜澳洲旅遊手冊</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="app-header" id="app-header"></header>
<main>
  <h2 class="section-title" style="margin-top:0">澳幣 ⇄ 台幣 快速換算</h2>

  <div class="converter-card">
    <label class="converter-field">
      <span>澳幣 AUD</span>
      <input type="number" id="aud-input" inputmode="decimal" placeholder="0" />
    </label>
    <div class="converter-icon">⇅</div>
    <label class="converter-field">
      <span>台幣 TWD</span>
      <input type="number" id="twd-input" inputmode="decimal" placeholder="0" />
    </label>
  </div>

  <div class="rate-info" id="rate-info">匯率讀取中…</div>
  <p class="hint">僅供購物時快速估算參考，實際刷卡/現場換匯匯率會略有不同</p>
</main>

<script src="js/data.js"></script>
<script src="js/weather.js"></script>
<script src="js/currency.js"></script>
<script src="js/app.js"></script>
<script>renderCurrencyPage();</script>
</body>
</html>
