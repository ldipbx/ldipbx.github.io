<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#111111" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦘</text></svg>" />
<title>匯率換算｜澳洲旅遊手冊</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="app-header" id="app-header"></header>
<main>
  <h2 class="section-title" style="margin-top:0">澳幣 ⇄ 台幣 快速換算</h2>

  <div class="converter-card">
    <label class="converter-field">
      <span>澳幣 AUD</span>
      <input type="number" id="aud-input" inputmode="decimal" placeholder="0" />
    </label>
    <div class="converter-icon">⇅</div>
    <label class="converter-field">
      <span>台幣 TWD</span>
      <input type="number" id="twd-input" inputmode="decimal" placeholder="0" />
    </label>
  </div>

  <div class="rate-info" id="rate-info">匯率讀取中…</div>
  <p class="hint">僅供購物時快速估算參考，實際刷卡/現場換匯匯率會略有不同</p>

  <h2 class="section-title">團員名單（點名字可以改）</h2>
  <div class="member-names" id="members-list"></div>

  <h2 class="section-title">新增花費</h2>
  <div class="converter-card">
    <label class="converter-field">
      <span>項目說明</span>
      <input type="text" id="expense-desc" placeholder="例如：晚餐 BangPop" />
    </label>
    <div class="expense-amount-row">
      <label class="converter-field">
        <span>金額</span>
        <input type="number" id="expense-amount" inputmode="decimal" placeholder="0" />
      </label>
      <label class="converter-field currency-select-field">
        <span>幣別</span>
        <select id="expense-currency">
          <option value="AUD">AUD</option>
          <option value="TWD">TWD</option>
        </select>
      </label>
    </div>
    <div class="split-field-label">誰付的錢？</div>
    <div class="member-chips" id="payer-select"></div>
    <div class="split-field-label">誰要分攤？</div>
    <div class="member-chips" id="participants-select"></div>
    <div class="rate-stale" id="expense-error"></div>
    <button type="button" class="refresh-btn add-expense-btn" id="add-expense-btn">新增這筆花費</button>
  </div>

  <h2 class="section-title">花費紀錄</h2>
  <div id="expense-list"></div>

  <h2 class="section-title">結算</h2>
  <div id="settlement-result"></div>
  <p class="hint">所有分帳資料只存在這台裝置裡，不會同步給其他人</p>
</main>

<script src="js/data.js"></script>
<script src="js/weather.js"></script>
<script src="js/currency.js"></script>
<script src="js/splitter.js"></script>
<script src="js/app.js"></script>
<script>renderCurrencyPage();</script>
</body>
</html>
