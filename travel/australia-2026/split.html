<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#111111" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦘</text></svg>" />
<title>分帳工具｜澳洲旅遊手冊</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="app-header" id="app-header"></header>
<main>
  <div id="sync-gate"></div>
  <p class="hint" id="split-rate-info">匯率讀取中…</p>

  <h2 class="section-title" style="margin-top:0">團員名單</h2>
  <div class="member-chips" id="members-list"></div>
  <p class="hint">團員名單由管理者統一設定，如需新增/修改請聯絡管理者</p>

  <h2 class="section-title">新增花費</h2>
  <div class="converter-card">
    <label class="converter-field">
      <span>項目說明</span>
      <input type="text" id="expense-desc" placeholder="例如：晚餐 BangPop" />
    </label>
    <div class="expense-amount-row">
      <label class="converter-field">
        <span>金額</span>
        <input type="number" id="expense-amount" inputmode="decimal" placeholder="0" />
      </label>
      <label class="converter-field currency-select-field">
        <span>幣別</span>
        <select id="expense-currency">
          <option value="AUD">AUD</option>
          <option value="TWD">TWD</option>
        </select>
      </label>
    </div>
    <div class="split-field-label">誰付的錢？</div>
    <div class="member-chips" id="payer-select"></div>
    <div class="split-field-label">誰要分攤？</div>
    <div class="member-chips" id="participants-select"></div>
    <div class="rate-stale" id="expense-error"></div>
    <button type="button" class="add-expense-btn" id="add-expense-btn">新增這筆花費</button>
  </div>

  <h2 class="section-title">花費紀錄</h2>
  <div id="expense-list"></div>

  <h2 class="section-title">結算</h2>
  <div id="settlement-result"></div>
  <p class="hint">輸入旅遊代碼並連線後，分帳資料會即時同步給輸入同一組代碼的所有人；沒有連線的話則只存在這台裝置裡</p>
</main>

<script src="https://www.gstatic.com/firebasejs/12.5.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.5.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore-compat.js"></script>
<script src="js/data.js"></script>
<script src="js/currency.js"></script>
<script src="js/cloudsync.js"></script>
<script src="js/splitter.js"></script>
<script src="js/app.js"></script>
<script>renderSplitPage();</script>
</body>
</html>
